<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/index.css">

  <title>App Cake</title>
</head>
<body>
  
  <header class="header scrolled">
    <div class="logo">
      <a href="index.html">
        <img src="/assets/Logo2.png" alt="">
      </a>
    </div>
    <div class="header-icons">
        <form action="" id="searchForm">
          <input type="search" placeholder="Pesquisar sabor" id="search-input">
        </form>
        <button id="btn-search" class="lupa"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button id="btn-menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        
        <div class="menu-modal" id="menuModal">
          <div class="menu-content">
            <button class="close-menu" id="closeMenu">
              <i class="fa-solid fa-x"></i>
            </button>

            <a href="index.html" class="item-modal" data-page="index">Home</a>
            <a href="galeria.html" class="item-modal" data-page="galeria">Galeria</a>
            <a href="#" class="item-modal" data-page="cardapio">Cardápio</a>
            <a href="#" class="item-modal" data-page="carrinho">Carrinho</a>
          </div>
        </div>
    </div>
  </header>

  <section class="heroBanner carousel" id="heroCarousel">

    <div class="carousel-track" id="bannerTrack">
      <div class="carousel-item">
        <div class="banner">
          <img src="/assets/hero-banner-sm.png">
        </div>
      </div>
      <div class="carousel-item">
        <div class="banner">
          <img src="/assets/hero-banner2-sm.png">
        </div>
      </div>
    </div>
    <div class="arrow left" id="bannerPrev">
      <i class="fa-solid fa-angle-left"></i> 
    </div>
    <div class="arrow right" id="bannerNext">
      <i class="fa-solid fa-angle-right"></i>
    </div>
  </section>
  
  <h3 class="title">Mais pedidos</h3>
  
  <section class="section-maisPedidos carousel" id="pedidoCarousel">

    <div class="carousel-track" id="pedidoTrack">
      <div class="carousel-item">
        <div class="card">
          <img src="/assets/cupcake-chocolate-md.png">
          
          <div class="card-footer">
            <p class="title-product">Chocolate</p>
            <div class="buttons">
              <button class="buy-btn">Comprar</button>
              <button class="fav-btn"><i class="fa-regular fa-heart"></i></button>
              <button class="fav-btn-clicado"><i class="fa-solid fa-heart"></i></button>
            </div>
          </div>
        </div>
      </div>

      <div class="carousel-item">
        <div class="card">
          <img src="/assets/cupcake-doceleite-md.png">

          <div class="card-footer">
            <p class="title-product">Doce de Leite</p>
            <div class="buttons">
              <button class="buy-btn">Comprar</button>
              <button class="fav-btn"><i class="fa-regular fa-heart"></i></button>
              <button class="fav-btn-clicado"><i class="fa-solid fa-heart"></i></button>
            </div>
          </div>
        </div>
      </div>
      <div class="carousel-item">
        <div class="card">
          <img src="/assets/cupcake-redvelvet-md.png">

          <div class="card-footer">
            <p class="title-product">Red Velvet</p>
            <div class="buttons">
              <button class="buy-btn">Comprar</button>
              <button class="fav-btn"><i class="fa-regular fa-heart"></i></button>
              <button class="fav-btn-clicado"><i class="fa-solid fa-heart"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="arrow left">
      <i class="fa-solid fa-angle-left"></i>
    </div>
    <div class="arrow right">
      <i class="fa-solid fa-angle-right"></i>
    </div>
  </section>

  <h3 class="title">Galeria de Fotos</h3>

  <section class="gallery carousel">
    <div class="gallery-track" id="galleryTrack">
      <div class="gallery-item">
        <img src="/assets/cupcake-chocolate-sm.png">
      </div>
      
      <div class="gallery-item">
        <img src="/assets/cupcake-doceleite-sm.png">
      </div>
      
      <div class="gallery-item">
        <img src="/assets/cupcake-redvelvet-sm.png">
      </div>
      
      <div class="gallery-item">
        <img src="/assets/cupcake-baunilha-sm.png">
      </div>
      
    </div>

    <div class="arrow left" id="galleryPrev">
      <i class="fa-solid fa-angle-left"></i>
    </div>
    <div class="arrow right" id="galleryNext">
      <i class="fa-solid fa-angle-right"></i>
    </div>
  </section>

  <footer>
    Feito por Cleysson Santos
  </footer>

  <script src="/js/index.js" defer></script>
</body>
</html>
