<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/index.css">

  <title>App Cake</title>
</head>
<body>
  
  <header class="header scrolled">
    <div class="logo">
      <img src="/assets/Logo2.png" alt="">
    </div>
    <div class="header-icons">
      <button class="btn-search"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="btn-menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <section class="heroBanner carousel">

    <div class="carousel-track" id="bannerTrack">
      <div class="carousel-item">
        <div class="banner">
          <img src="/assets/hero-banner-tablet.png">
        </div>
      </div>
      <div class="carousel-item">
        <div class="banner">
          <img src="/assets/hero-banner2-tablet.png">
        </div>
      </div>
    </div>
    <div class="arrow left" id="pedidoPrev">
      <i class="fa-solid fa-angle-left"></i> 
    </div>
    <div class="arrow right" id="pedidoNext">
      <i class="fa-solid fa-angle-right"></i>
    </div>
  </section>
  
  <h3 class="title">Mais pedidos</h3>
  
  <section class="section-maisPedidos carousel">

    <div class="carousel-track" id="pedidoTrack">
      <div class="carousel-item">
        <div class="card">
          <img src="/assets/cupcake-chocolate-md.png">
          
          <div class="card-footer">
            <p class="title-product">Chocolate</p>
            <div class="buttons">
              <button class="buy-btn">Comprar</button>
              <button class="fav-btn"><i class="fa-regular fa-heart"></i></button>
              <button class="fav-btn-clicado"><i class="fa-solid fa-heart"></i></button>
            </div>
          </div>
        </div>
      </div>

      <div class="carousel-item">
        <div class="card">
          <img src="/assets/cupcake-doceleite-md.png">

          <div class="card-footer">
            <p class="title-product">Doce de Leite</p>
            <div class="buttons">
              <button class="buy-btn">Comprar</button>
              <button class="fav-btn"><i class="fa-regular fa-heart"></i></button>
              <button class="fav-btn-clicado"><i class="fa-solid fa-heart"></i></button>
            </div>
          </div>
        </div>
      </div>
      <div class="carousel-item">
        <div class="card">
          <img src="/assets/cupcake-redvelvet-md.png">

          <div class="card-footer">
            <p class="title-product">Red Velvet</p>
            <div class="buttons">
              <button class="buy-btn">Comprar</button>
              <button class="fav-btn"><i class="fa-regular fa-heart"></i></button>
              <button class="fav-btn-clicado"><i class="fa-solid fa-heart"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="arrow left">
      <i class="fa-solid fa-angle-left"></i>
    </div>
    <div class="arrow right">
      <i class="fa-solid fa-angle-right"></i>
    </div>

    <div class="dots" id="bannerDots">
      <div class="dot"><i class="fa-solid fa-circle"></i></div>
    </div>
  </section>

  <h3 class="title">Galeria de Fotos</h3>

  <section class="gallery carousel">
    <div class="carousel-track" id="galleryTrack">
      <div class="gallery-track" id="infiniteGallery">
        <div class="gallery-item">
          <img src="/assets/cupcake-chocolate-sm.png">
        </div>
        
        <div class="gallery-item">
          <img src="/assets/cupcake-doceleite-sm.png">
        </div>
        
        <div class="gallery-item">
          <img src="/assets/cupcake-redvelvet-sm.png">
        </div>

        <div class="gallery-item">
          <img src="/assets/cupcake-baunilha-sm.png">
        </div>
      </div>
    </div>

    <div class="arrow left">
      <i class="fa-solid fa-angle-left"></i>
    </div>
    <div class="arrow right">
      <i class="fa-solid fa-angle-right"></i>
    </div>
  </section>

  <footer>
    Feito por Cleysson Santos
  </footer>

  <script src="/js/index.js" defer></script>
</body>
</html>
