<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/index.css">

  <title>App Cake</title>
</head>
<body>
  
  <header class="header">
    <div class="logo">
      <img src="/assets/Logo2.png" alt="">
    </div>
    <div class="header-icons">
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-solid fa-bars"></i>
    </div>
  </header>

  <section class="banner">
    <div class="banner-box">
      <img src="/assets/hero-banner.png">
    </div>
  </section>
  
  <h3 class="title">Mais pedidos</h3>
  
  <section class="section-maisPedidos">

    <div class="card">
      <img src="/assets/cupcake-chocolate-md.png">

      <div class="card-footer">
        <p class="title-product">Chocolate</p>
        <div class="buttons">
        <button class="buy-btn">Comprar</button>
          <button class="fav-btn"><i class="fa-regular fa-heart"></i></button>
        </div>
      </div>
    </div>
  </section>

  <section class="gallery">
    <h3 class="title">Galeria de Fotos</h3>

    <div class="gallery-container">
      <img src="https://images.unsplash.com/photo-1606312619070-d48b4c652a52">
      <img src="https://images.unsplash.com/photo-1587248720327-8eb72564be1e">
    </div>
  </section>

  <footer>
    Feito por Cleysson Santos
  </footer>

</body>
</html>
