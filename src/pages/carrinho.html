<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />


  <!-- fonts -->
   <link rel="stylesheet" href="/src/styles/vendor/fonts/google-fonts.css">


  <!-- global -->
    <link rel="stylesheet" href="/src/styles/global.css">
    <link rel="stylesheet" href="/src/styles/components/variaveis.css">
    
  <!-- styles -->
  <link rel="stylesheet" href="/src/styles/pages/carrinho.css">
    <link rel="stylesheet" href="/src/styles/layouts/top-bar.css">
    <link rel="stylesheet" href="/src/styles/layouts/header.css">
    <link rel="stylesheet" href="/src/styles/layouts/footer.css">
    <link rel="stylesheet" href="/src/styles/layouts/filters.css">

  <title>App Cake</title>
</head>
<body>
  
  <header class="header scrolled">
    <div class="logo">
      <a href="#">
        <h1>app<span>cake</span></h1>
      </a>
    </div>
    <div class="navBar">
      <a href="#">Home</a>
      <a href="galeria.html">Galeria</a>
      <a href="cardapio.html">Cardápio</a>
    </div>
    <div class="header-icons">
        <form action="" id="searchForm">
          <input type="search" placeholder="Pesquisar sabor" id="search-input">
        </form>
        <button id="btn-search" class="lupa"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button id="btn-carrinho">
          <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
        </button>
        <div class="navBar">
          <a href="#" id="carrinho">Carrinho</a>
        </div>
        <button id="btn-menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        
        <div class="menu-modal" id="menuModal">
          <div class="menu-content">
            <button class="close-menu" id="closeMenu">
              <i class="fa-solid fa-x"></i>
            </button>

            <a href="/index.html" class="item-modal" data-page="index">Home</a>
            <a href="/src/pages/galeria.html" class="item-modal" data-page="galeria">Galeria</a>
            <a href="/src/pages/cardapio.html" class="item-modal" data-page="cardapio">Cardápio</a>
            <a href="#" class="item-modal" data-page="carrinho">Carrinho</a>
          </div>
        </div>
    </div>
  </header>

  <div class="top-bar">
    <a class="arrow" id="btnBack" onClick="history.back()">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <h2>Carrinho</h2>
  </div>

  <main class="cart">

    <article class="cart-card">
        <img src="/src/assets/images/mobile/cupcake-doceleite-sm.png" alt="Cupcake">
        <div class="cart-info">
            <h2>Leite Condensado</h2>
            <div class="quantity">
                <div>Quantidade:</div>
                <div class="controls">
                    <button>-</button>
                    <div>1</div>
                    <button>+</button>
                </div>
            </div>
            <p class="price">R$ 7,99</p>
        </div>
    </article>

    <article class="cart-card">
        <img src="/src/assets/images/mobile/cupcake-chocolate-sm.png" alt="Cupcake">
        <div class="cart-info">
            <h2>Chocolate</h2>
            <div class="quantity">
                <div>Quantidade:</div>
                <div class="controls">
                    <button>-</button>
                    <div>1</div>
                    <button>+</button>
                </div>
            </div>
            <p class="price">R$ 7,99</p>
        </div>
    </article>

</main>

<section class="finish">
    <a href="/src/pages/pagamento.html">
        <button class="finish-btn">
            Finalizar Pedido
        </button>
    </a>
</section>


  <script src="/src/scripts/commons/header.js" defer></script>
  <script src="/src/scripts/commons/carrossel.js" defer></script>
</body>
</html>
