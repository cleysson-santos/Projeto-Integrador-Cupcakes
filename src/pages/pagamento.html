<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />


  <!-- fonts -->
   <link rel="stylesheet" href="/src/styles/vendor/fonts/google-fonts.css">


  <!-- global -->
    <link rel="stylesheet" href="/src/styles/global.css">
    <link rel="stylesheet" href="/src/styles/components/variaveis.css">
    
  <!-- styles -->
    <link rel="stylesheet" href="/src/styles/pages/pagamento.css">
    <link rel="stylesheet" href="/src/styles/layouts/top-bar.css">
    <link rel="stylesheet" href="/src/styles/layouts/header.css">
    <link rel="stylesheet" href="/src/styles/layouts/footer.css">
    <link rel="stylesheet" href="/src/styles/layouts/filters.css">

    <title>Pagamento</title>
</head>
<body>
    <header class="header scrolled">
        <div class="logo">
        <a href="#">
            <h1>app<span>cake</span></h1>
        </a>
        </div>
        <div class="navBar">
        <a href="#">Home</a>
        <a href="galeria.html">Galeria</a>
        <a href="cardapio.html">Cardápio</a>
        </div>
        <div class="header-icons">
            <form action="" id="searchForm">
            <input type="search" placeholder="Pesquisar sabor" id="search-input">
            </form>
            <button id="btn-search" class="lupa"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button id="btn-carrinho">
            <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
            </button>
            <div class="navBar">
            <a href="#" id="carrinho">Carrinho</a>
            </div>
            <button id="btn-menu">
            <i class="fa-solid fa-bars"></i>
            </button>
            
            <div class="menu-modal" id="menuModal">
            <div class="menu-content">
                <button class="close-menu" id="closeMenu">
                <i class="fa-solid fa-x"></i>
                </button>

                <a href="/index.html" class="item-modal" data-page="index">Home</a>
                <a href="/src/pages/galeria.html" class="item-modal" data-page="galeria">Galeria</a>
                <a href="/src/pages/cardapio.html" class="item-modal" data-page="cardapio">Cardápio</a>
                <a href="/src/pages/carrinho.html" class="item-modal" data-page="carrinho">Carrinho</a>
            </div>
            </div>
        </div>
    </header>

    <div class="top-bar">
        <a href="/src/pages/carrinho.html" class="arrow"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>Finalizar Pedido</h2>
    </div>

    <main>
    <section class="delivery">
        <h2>Endereço de Entrega</h2>
        <input type="text" placeholder="Endereço">
        <div class="row">
            <input class="small" type="number" placeholder="Número">
        </div>
        <input type="text" placeholder="Complemento">
    </section>

    <section class="payment">
        <h2>Forma de Pagamento</h2>
        <div class="payment-content">
            <div class="payment-methods">
                <label>
                    <input type="radio" name="pagamento">
                    Crédito
                </label>
                <label>
                    <input type="radio" name="pagamento">
                    Débito
                </label>
                <label>
                    <input type="radio" name="pagamento">
                    Pix
                </label>
            </div>
            <div class="card-info">
                <input type="text" placeholder="Nº Cartão">
                <input type="text" placeholder="CVV">
                <input type="text" placeholder="Vencimento">
            </div>
        </div>
    </section>

    <section class="pix">
        <div class="pix-qrcode">
            Pix
        </div>
    </section>

    <section class="finish">
        <button class="finish-btn">
            Concluir Pedido
        </button>
    </section>
</main>


    <footer>
        Feito por Cleysson Santos
    </footer>

    <script src="/src/scripts/commons/header.js" defer></script>
    <script src="/src/scripts/commons/carrossel.js" defer></script>
</body>
</html>
